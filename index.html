<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fast, private and powerful tools to compress, convert and edit images and videos right in your browser." />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)" />
    <title>Refract — Media Toolkit</title>
    <script>
      // Apply persisted theme + language before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('refract:preferences');
          var prefs = raw ? JSON.parse(raw).state || {} : {};
          var theme = prefs.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (prefs.language === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
